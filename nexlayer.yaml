application:
  name: "cat-registry"
  pods:
    # Frontend - React app with Nginx reverse proxy
    - name: "client"
      image: "placeholder-will-be-updated"
      path: "/"
      servicePorts: [80]

    # Backend - Express API server
    - name: "server"
      image: "placeholder-will-be-updated"
      servicePorts: [5000]
      vars:
        PORT: "5000"
        NODE_ENV: "production"

